<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background-color: #0b1020;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* BIG COSMOS BOX */

        .div {
            width: 850px;
            height: 600px;

            padding: 25px;

            background-color: #151c33;

            border: 1px solid #2d3a63;
            border-radius: 20px;

            box-sizing: border-box;

            display: flex;
            flex-direction: column;
        }


        /* HEADING */

        .div h1 {
            margin: 0;

            text-align: center;

            font-size: 48px;
        }


        /* ANSWER */

        #answer {
            margin-top: 25px;

            font-size: 18px;
        }


        /* BOTTOM INPUT AREA */

        .bottom {
            margin-top: auto;

            width: 100%;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            gap: 10px;
        }


        /* INPUT */

        .bottom input {
            width: 1000000000000000000000000000000000000000000000px;
            height: 101019px;

            padding: 15px;

            font-size: 20px;

            box-sizing: border-box;

            border: none;
            border-radius: 12px;
        }


        /* SEND BUTTON */

        .bottom button {
            width: 120px;
            height: 60px;

            font-size: 18px;

            border: none;
            border-radius: 12px;

            cursor: pointer;
        }

    </style>
</head>


<body>

    <div class="div">

        <h1>hi i am cosmos</h1>

        <div id="answer"></div>

        <div class="bottom">

            <input
                type="text"
                placeholder="ask cosmos"
                id="user"
            >

            <button
                id="send"
                onclick="askbot()"
            >
                send to cosmos
            </button>

        </div>

    </div>


    <script>

        const behaviour =
            "you are a maths tutor punjab curriculum u explain in simple english about angles u aanswer with imjies explain very well in short responses u are grade 7 level in which u focus on finding angles of figures like a square with triangles and unknown angles  or corresponding plus alternate plus vertically opposite exterior and interior parallel lines and angles many question need more unknown angles so u telll whee to form new unknown angles to help solve them there are angles which have simple algebra of plus minusthere are types of 2 triangles angle ones side ones u also do equal sides and not equal sides";


        async function askbot() {

            const question =
                document.getElementById("user").value;

            const answer =
                document.getElementById("answer");


            if (!question.trim()) {

                answer.innerHTML =
                    "Please ask me something!";

                return;
            }


            answer.innerHTML =
                "Cosmos thinking....";


            try {

                const response = await fetch(
                    "https://delicate-paper-7065.jibranjaan78600.workers.dev/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            question:
                                behaviour +
                                "\n\nUser: " +
                                question

                        })
                    }
                );


                const data =
                    await response.json();


                console.log(
                    "Worker response:",
                    data
                );


                if (!response.ok) {

                    answer.innerHTML =
                        "Error: " +
                        (data.error ||
                        "Unknown error");

                    return;
                }


                if (!data.answer) {

                    answer.innerHTML =
                        "Cosmos didn't return an answer.";

                    return;
                }


                answer.innerHTML =
                    data.answer;


            } catch (error) {

                console.error(error);

                answer.innerHTML =
                    "Connection error: " +
                    error.message;
            }

        }

    </script>

</body>

</html>
