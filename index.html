<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-color: #0b1020;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input {
            width: 350px;
            height: 45px;
            font-size: 18px;
            padding: 0 12px;
            box-sizing: border-box;
        }
    
        button {
            width: 180px;
            height: 45px;
            font-size: 18px;
            margin-top: 10px;
        }
        h1 {
            font-size: 48px;
            margin-top: 40px;
            margin-bottom: 30px;
        }

    </style>
</head>

<body>

    <h1>hi i am cosmos</h1>

    <input type="text" placeholder="ask cosmos" id="user">

    <button id="send" onclick="askbot()">send to cosmos</button>

    <div id="answer"></div>

    <script>

        const behaviour =
            "You are an AI coding assistant who helps people with programming, debugging, and understanding code. Give clear and useful answers in short sentences so users do not get overwhelmed or bored. Keep explanations simple and direct. When giving code, provide only what is needed and briefly explain how it works. If the user makes a mistake, politely point it out and show the correct solution. Ask a short question if you need more information.";

        async function askbot() {

            const question = document.getElementById("user").value;

            const answer = document.getElementById("answer");

            if (!question.trim()) {
                answer.innerHTML = "Please ask me something!";
                return;
            }

            answer.innerHTML = "Cosmos thinking....";

            try {

                const response = await fetch(
                    "https://delicate-paper-7065.jibranjaan78600.workers.dev/",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            question:
                                behaviour +
                                "\n\nUser: " +
                                question
                        })
                    }
                );

                const data = await response.json();

                console.log("Worker response:", data);

                if (!response.ok) {
                    answer.innerHTML =
                        "Error: " +
                        (data.error || "Unknown error");
                    return;
                }

                if (!data.answer) {
                    answer.innerHTML =
                        "Cosmos didn't return an answer.";
                    return;
                }

                answer.innerHTML = data.answer;

            } catch (error) {

                console.error(error);

                answer.innerHTML =
                    "Connection error: " +
                    error.message;
            }
        }

    </script>

</body>
</html>
